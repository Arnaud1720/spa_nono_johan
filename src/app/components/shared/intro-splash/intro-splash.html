<div class="intro-splash">
  <!-- Background effects -->
  <div class="intro-splash__bg">
    <div class="grid-lines"></div>
    <div class="glow-orb glow-orb--1"></div>
    <div class="glow-orb glow-orb--2"></div>
  </div>

  <!-- Logo container -->
  <div class="intro-splash__content">
    <div class="logo-3d">
      <span class="logo-letter" data-letter="N">N</span>
      <span class="logo-letter" data-letter="O">O</span>
      <span class="logo-letter" data-letter="J">J</span>
      <span class="logo-letter" data-letter="O">O</span>
      <span class="logo-dot">.</span>
    </div>

    <p class="intro-tagline">
      <span class="tagline-bracket">&lt;</span>
      Créateur de Maquettes SPA
      <span class="tagline-bracket">/&gt;</span>
    </p>
  </div>

  <!-- Skip button -->
  <button class="intro-splash__skip" (click)="skipIntro()">
    Passer <span class="skip-key">[Esc]</span>
  </button>
</div>
